# Local testing - app only (no dovecot/postfix/nginx)
services:
  app:
    build: .
    container_name: mymail-app
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "2525:2525"
    volumes:
      - mymail-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    networks:
      - mymail-net

volumes:
  mymail-data:

networks:
  mymail-net:
    driver: bridge
