services:
  app:
    build: .
    container_name: mymail-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "25:25"
    volumes:
      - mymail-data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MAIL_HOST=postfix
      - SMTP_SEND_PORT=587
      - SMTP_TLS_REJECT_UNAUTHORIZED=false
    networks:
      - mymail-net
    depends_on:
      dovecot:
        condition: service_started
      postfix:
        condition: service_started

  dovecot:
    image: dovecot/dovecot:latest
    container_name: mymail-dovecot
    restart: unless-stopped
    ports:
      - "993:993"
    volumes:
      - mymail-data:/data
      - ./config/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ./config/dovecot/dovecot-sql.conf:/etc/dovecot/dovecot-sql.conf:ro
      - dovecot-ssl:/etc/dovecot/ssl
    environment:
      - DOVECOT_SSL_REQUIRED=yes
    networks:
      - mymail-net

  postfix:
    image: boky/postfix
    container_name: mymail-postfix
    restart: unless-stopped
    ports:
      - "587:587"
    environment:
      - HOSTNAME=${DOMAIN:-mail.example.com}
      - ALLOWED_SENDER_DOMAINS=${DOMAIN:-example.com}
      - INBOUND_ENABLED=false
    volumes:
      - postfix-spool:/var/spool/postfix
    networks:
      - mymail-net

  nginx:
    image: nginx:alpine
    container_name: mymail-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - mymail-net

volumes:
  mymail-data:
  dovecot-ssl:
  nginx-ssl:
  postfix-spool:

networks:
  mymail-net:
    driver: bridge
