# MyMail Dovecot Configuration

# Protocols: IMAP only
protocols = imap

# Disable plaintext authentication
disable_plaintext_auth = yes

# SSL configuration
ssl = required
ssl_cert = </etc/dovecot/ssl/fullchain.pem
ssl_key = </etc/dovecot/ssl/privkey.pem
ssl_min_protocol = TLSv1.2

# Authentication
auth_mechanisms = plain login

# Passdb: SQLite backend
passdb {
    driver = sql
    args = /etc/dovecot/dovecot-sql.conf
}

# Userdb: SQLite backend
userdb {
    driver = sql
    args = /etc/dovecot/dovecot-sql.conf
}

# Mail location
mail_location = maildir:/data/maildir/%d/%n
mail_home = /data/maildir/%d/%n

# Namespace configuration
namespace inbox {
    separator = /
    inbox = yes

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }
    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }
    mailbox Trash {
        special_use = \Trash
        auto = subscribe
    }
    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }
}

# Logging
log_path = /dev/stdout
auth_verbose = yes
auth_debug = no

# Service configuration
service imap-login {
    inet_listener imap {
        port = 0
    }
    inet_listener imaps {
        port = 993
    }
}

# Process limits
default_process_limit = 100
default_client_limit = 1000
