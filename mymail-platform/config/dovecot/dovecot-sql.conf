# MyMail Dovecot SQL Authentication Configuration

# SQLite driver
driver = sqlite

# Database path
connect = /data/mymail.db

# Password query - authenticate user by email and password
password_query = SELECT \
    email AS user, \
    password, \
    '%w' AS userdb_home, \
    '/data/maildir/%d/%n' AS userdb_mail \
    FROM users \
    WHERE email = '%u'

# User query - look up user info
user_query = SELECT \
    '/data/maildir/%d/%n' AS home, \
    'maildir:/data/maildir/%d/%n' AS mail, \
    1000 AS uid, \
    1000 AS gid \
    FROM users \
    WHERE email = '%u'

# Password scheme
default_pass_scheme = BLF-CRYPT
