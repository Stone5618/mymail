# MyMail Go 后端安全扫描
#
# 触发条件：
#   - 定时：每周一 02:00 UTC 自动执行
#   - 手动：workflow_dispatch
# 扫描项：gosec / govulncheck / Trivy（Docker 镜像） / npm audit（前端依赖）
# 任一扫描失败时自动创建 Issue 通知。
name: Security

on:
  schedule:
    # 每周一 02:00 UTC（北京时间周一 10:00）
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # 失败时创建 Issue 通知

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  # ===== gosec: Go 代码安全扫描 =====
  gosec:
    name: gosec (Go Code)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mymail-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: mymail-go/go.sum
      - name: 安装 gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: gosec 扫描（生成 JSON 报告）
        run: |
          gosec -severity medium -confidence medium -fmt=json -out=gosec-report.json ./... || true
      - name: gosec 严格扫描（HIGH 以上失败）
        run: gosec -severity medium -confidence medium ./...
      - name: 上传 gosec 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: mymail-go/gosec-report.json
          retention-days: 14

  # ===== govulncheck: Go 依赖漏洞检查 =====
  govulncheck:
    name: govulncheck (Go Deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mymail-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: mymail-go/go.sum
      - name: govulncheck 漏洞检查
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ===== Trivy: Docker 镜像漏洞扫描 =====
  trivy:
    name: Trivy (Docker Image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Docker 镜像（仅用于扫描）
        run: |
          docker build -t mymail:scan -f mymail-go/deployments/docker/Dockerfile .
      - name: Trivy 漏洞扫描（CRITICAL/HIGH 失败）
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mymail:scan
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: 生成 Trivy SARIF 报告
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mymail:scan
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
      - name: 上传 SARIF 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          retention-days: 14

  # ===== npm audit: 前端依赖漏洞扫描 =====
  npm-audit:
    name: npm audit (Frontend Deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mymail-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mymail-vue/package-lock.json
      - name: npm audit（HIGH/CRITICAL 级别即失败）
        run: npm audit --audit-level=high --omit=dev

  # ===== 失败通知：创建 Issue =====
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [gosec, govulncheck, trivy, npm-audit]
    if: always()
    steps:
      - name: 输出各扫描结果
        run: |
          echo "===== 安全扫描结果汇总 ====="
          echo "gosec:        ${{ needs.gosec.result }}"
          echo "govulncheck:  ${{ needs.govulncheck.result }}"
          echo "trivy:        ${{ needs.trivy.result }}"
          echo "npm-audit:    ${{ needs.npm-audit.result }}"
          echo "=============================="
      - name: 创建 Issue 通知（仅当有扫描失败时）
        if: ${{ needs.gosec.result == 'failure' || needs.govulncheck.result == 'failure' || needs.trivy.result == 'failure' || needs.npm-audit.result == 'failure' }}
        uses: actions/github-script@v7
        with:
          script: |
            const results = {
              'gosec': '${{ needs.gosec.result }}',
              'govulncheck': '${{ needs.govulncheck.result }}',
              'trivy': '${{ needs.trivy.result }}',
              'npm-audit': '${{ needs.npm-audit.result }}'
            };
            const failed = Object.entries(results)
              .filter(([, v]) => v === 'failure')
              .map(([k]) => k);
            const trigger = context.eventName === 'schedule'
              ? '定时任务（每周一 02:00 UTC）'
              : '手动触发';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 安全扫描失败告警 - ${new Date().toISOString().slice(0, 10)}`,
              body: [
                '## ⚠️ 安全扫描失败',
                '',
                `**触发方式：** ${trigger}`,
                `**运行链接：** ${runUrl}`,
                `**失败任务：** ${failed.join(', ') || '无'}`,
                '',
                '请尽快排查并修复安全问题，详见运行日志与产物报告。',
                '',
                '> 此 Issue 由安全扫描工作流自动创建，修复后可手动关闭。'
              ].join('\n'),
              labels: ['security', 'automated']
            });
            core.notice(`安全扫描失败，已创建 Issue 通知。失败任务：${failed.join(', ')}`);
      - name: 全部扫描通过
        if: ${{ !(needs.gosec.result == 'failure' || needs.govulncheck.result == 'failure' || needs.trivy.result == 'failure' || needs.npm-audit.result == 'failure') }}
        run: echo "✅ 所有安全扫描已通过，无需通知"
