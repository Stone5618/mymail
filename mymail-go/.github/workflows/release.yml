# MyMail Go 后端发布工程
#
# 触发：推送 v* 标签（如 v1.0.0、v1.2.3-rc1）
# 产物：
#   - 多平台 Go 二进制（linux/amd64, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64）
#   - Docker 多架构镜像（linux/amd64 + linux/arm64），推送至 Docker Hub
#   - GitHub Release（附带二进制 + 自动生成 changelog）
#
# 流程：先构建前端 → 嵌入 web/dist/ → 交叉编译各平台二进制；Docker 镜像由 Dockerfile 自行构建前端。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 GitHub Release

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  # ===== 构建前端（一次构建，供各平台 Go 二进制嵌入复用） =====
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mymail-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mymail-vue/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 构建前端
        run: npm run build
      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: mymail-vue/dist
          retention-days: 3

  # ===== 多平台 Go 二进制构建（嵌入前端） =====
  build-binaries:
    name: Build Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: frontend-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: mymail-go/go.sum
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: mymail-go/web/dist
      - name: 准备嵌入目录（清理占位文件）
        run: |
          rm -f mymail-go/web/dist/.gitkeep
          ls -la mymail-go/web/dist
      - name: 解析版本号
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: 交叉编译
        working-directory: mymail-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../dist
          OUT="../dist/mymail-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "$OUT" ./cmd/mymail
          ls -lh "$OUT"
      - name: 上传二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mymail-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 3

  # ===== Docker 多架构镜像构建与推送 =====
  docker:
    name: Docker Multi-arch Build & Push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解析版本号
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: 设置 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送多架构镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: mymail-go/deployments/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mymail/mymail:${{ steps.version.outputs.version }}
            mymail/mymail:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 输出镜像信息
        run: |
          echo "已推送镜像："
          echo "  mymail/mymail:${{ steps.version.outputs.version }}"
          echo "  mymail/mymail:latest"

  # ===== 发布 GitHub Release =====
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 获取完整历史以生成 changelog
      - name: 下载所有二进制产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: 列出发布物
        run: ls -lh dist/
      - name: 生成 changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "log<<EOF"
            if [[ -n "$PREV_TAG" ]]; then
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
            else
              git log --pretty=format:"- %s (%h)"
            fi
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## 变更内容

            ${{ steps.changelog.outputs.log }}

            ## 下载

            请根据目标平台选择对应的二进制文件：

            | 文件 | 平台 |
            | --- | --- |
            | `mymail-linux-amd64` | Linux x86_64 |
            | `mymail-linux-arm64` | Linux ARM64 |
            | `mymail-darwin-amd64` | macOS Intel |
            | `mymail-darwin-arm64` | macOS Apple Silicon |
            | `mymail-windows-amd64.exe` | Windows x86_64 |

            ## Docker

            ```bash
            docker pull mymail/mymail:${{ github.ref_name }}
            docker run -d -p 3000:3000 -p 25:25 mymail/mymail:${{ github.ref_name }}
            ```
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
