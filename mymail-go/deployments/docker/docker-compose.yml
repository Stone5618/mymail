services:
  app:
    image: mymail-app:latest
    build:
      context: ../../..
      dockerfile: mymail-go/deployments/docker/Dockerfile
      args:
        - VERSION=${VERSION:-0.1.0}
        - BUILD_TIME=${BUILD_TIME:-}
        - COMMIT_SHA=${COMMIT_SHA:-}
    container_name: mymail-app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    user: root
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "25:25"
    volumes:
      - mymail-data:/app/data
      - /opt/mymail/mymail-go/.env:/app/.env:ro
    environment:
      - ENV=prod
      - DB_PATH=/app/data/mymail.db
      - MAILDIR_PATH=/app/data/maildir
      - ATTACHMENT_PATH=/app/data/attachments
      - AVATAR_PATH=/app/data/avatars
      - MAIL_HOST=postfix
      - SMTP_SEND_PORT=587
    networks:
      - mymail-net
    depends_on:
      dovecot:
        condition: service_started
      postfix:
        condition: service_started

  dovecot:
    image: dovecot/dovecot:latest
    container_name: mymail-dovecot
    user: root
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    ports:
      - "993:993"
    volumes:
      - mymail-data:/app/data
      - /opt/mymail/mymail-go/config/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - /opt/mymail/mymail-go/config/dovecot/dovecot-sql.conf:/etc/dovecot/dovecot-sql.conf:ro
      - dovecot-ssl:/etc/dovecot/ssl
    networks:
      - mymail-net

  postfix:
    image: boky/postfix
    container_name: mymail-postfix
    restart: unless-stopped
    ports:
      - "587:587"
    environment:
      - HOSTNAME=pymt.qzz.io
      - ALLOWED_SENDER_DOMAINS=pymt.qzz.io
      - INBOUND_ENABLED=false
    volumes:
      - postfix-spool:/var/spool/postfix
    networks:
      - mymail-net

volumes:
  mymail-data:
  dovecot-ssl:
  postfix-spool:

networks:
  mymail-net:
    driver: bridge
