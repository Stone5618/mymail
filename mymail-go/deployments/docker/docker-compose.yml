# MyMail Docker Compose
# 修复：P1-9（数据卷路径统一 /app/data）、P1-11（移除 SMTP_TLS_REJECT_UNAUTHORIZED=false）
#
# 启动：docker compose -f deployments/docker/docker-compose.yml up -d
# 构建上下文为项目根目录（mymail/），以访问 mymail-go/ 和 mymail-vue/

services:
  app:
    build:
      context: ../../..
      dockerfile: mymail-go/deployments/docker/Dockerfile
    container_name: mymail-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "25:25"
    volumes:
      # P1-9: 统一数据卷挂载到 /app/data
      - mymail-data:/app/data
    env_file:
      - ../../.env
    environment:
      - ENV=prod
      - DB_PATH=/app/data/mymail.db
      - MAILDIR_PATH=/app/data/maildir
      - ATTACHMENT_PATH=/app/data/attachments
      - MAIL_HOST=postfix
      - SMTP_SEND_PORT=587
      # P1-11: 不再设置 SMTP_TLS_REJECT_UNAUTHORIZED=false（默认 true，保证 TLS 安全）
    networks:
      - mymail-net
    depends_on:
      dovecot:
        condition: service_started
      postfix:
        condition: service_started

  dovecot:
    image: dovecot/dovecot:latest
    container_name: mymail-dovecot
    restart: unless-stopped
    ports:
      - "993:993"
    volumes:
      # P1-9: 与 app 共享 /app/data（maildir + mymail.db）
      - mymail-data:/app/data
      - ../../config/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - ../../config/dovecot/dovecot-sql.conf:/etc/dovecot/dovecot-sql.conf:ro
      - dovecot-ssl:/etc/dovecot/ssl
    networks:
      - mymail-net

  postfix:
    image: boky/postfix
    container_name: mymail-postfix
    restart: unless-stopped
    ports:
      - "587:587"
    environment:
      - HOSTNAME=${DOMAIN:-mail.example.com}
      - ALLOWED_SENDER_DOMAINS=${DOMAIN:-example.com}
      - INBOUND_ENABLED=false
    volumes:
      - postfix-spool:/var/spool/postfix
    networks:
      - mymail-net

  nginx:
    image: nginx:alpine
    container_name: mymail-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - mymail-net

volumes:
  mymail-data:
  dovecot-ssl:
  nginx-ssl:
  postfix-spool:

networks:
  mymail-net:
    driver: bridge
