dovecot_config_version = 2.4.3
dovecot_storage_version = 2.4.3
# MyMail Dovecot — 2.4.3 (2026-07-05)

protocols = imap

default_internal_user = vmail
default_internal_group = vmail
default_login_user = vmail

ssl_server {
    cert_file = /etc/dovecot/ssl/tls.crt
    key_file = /etc/dovecot/ssl/tls.key
}

auth_mechanisms = plain login

sql_driver = sqlite
sqlite_path = /app/data/mymail.db

passdb_sql_query = SELECT email AS user, dovecot_password_hash AS password FROM users WHERE email = '%{user}' AND is_active = 1

userdb_sql_query = SELECT '/app/data/maildir/%d/%n' AS home, 1000 AS uid, 1000 AS gid FROM users WHERE email = '%{user}' AND is_active = 1

passdb_default_password_scheme = BLF-CRYPT

passdb sql {
}
userdb sql {
}

mail_driver = maildir
mail_home = /app/data/maildir/%d/%n

namespace inbox {
    separator = /
    inbox = yes
    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }
    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }
    mailbox Trash {
        special_use = \Trash
        auto = subscribe
    }
    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }
}

log_path = /dev/stdout
auth_verbose = yes

service imap-login {
    inet_listener imap {
        port = 0
    }
    inet_listener imaps {
        port = 993
    }
}

default_process_limit = 100
default_client_limit = 1000
