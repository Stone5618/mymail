# MyMail Dovecot SQL Authentication Configuration
#
# 修复历史：
#   P0-1：password → password_hash（Go 版 schema 列名）
#   P1-9：connect 路径统一 /app/data/mymail.db
#   P1-10：uid/gid 固定 1000（与 Dockerfile USER 1000:1000 匹配）

# SQLite driver
driver = sqlite

# P1-9：数据库路径统一到 /app/data/mymail.db（与 docker-compose 数据卷一致）
connect = /app/data/mymail.db

# Password query - authenticate user by email and password
# P0-1：列名 password → password_hash（Go 版 users 表列名）
password_query = SELECT \
    email AS user, \
    password_hash, \
    '%w' AS userdb_home, \
    '/app/data/maildir/%d/%n' AS userdb_mail \
    FROM users \
    WHERE email = '%u' AND is_active = 1

# User query - look up user info
# P1-9：maildir 路径统一到 /app/data/maildir/
# P1-10：uid/gid 固定 1000（与 Dockerfile 运行用户一致）
user_query = SELECT \
    '/app/data/maildir/%d/%n' AS home, \
    'maildir:/app/data/maildir/%d/%n' AS mail, \
    1000 AS uid, \
    1000 AS gid \
    FROM users \
    WHERE email = '%u' AND is_active = 1

# Password scheme（Go 版用 bcrypt，Dovecot 用 BLF-CRYPT 兼容）
default_pass_scheme = BLF-CRYPT
